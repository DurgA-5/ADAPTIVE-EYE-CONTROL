# AdaptiveEye - Blink Detection & Intentional Eye Clicking Configuration
blink_detection:
  ear_threshold: 0.18                  # Natural full-closure threshold (immune to looking downward)
  min_blink_duration_ms: 220.0         # 220ms - 650ms = intentional conscious deliberate single blink
  max_click_blink_duration_ms: 650.0   # Upper bound for deliberate single click blink
  double_click_window_ms: 650.0        # Comfortable double-blink window (allows ample time for 2nd blink)
  long_blink_right_click_ms: 9999.0    # Long blink right click disabled (pure single & double click mode)
  enable_wink_clicking: false          # Unilateral winking disabled
  enable_wink_right_click: false       # Unilateral winking disabled
  wink_min_duration_ms: 280.0          # Minimum wink hold time
  click_debounce_ms: 250.0             # Refractory period after click to prevent repeats
  enable_sound_feedback: true          # Play sound chime on successful click
  hold_position_during_blink: true     # Freeze cursor coordinate during click blink
  mirror_mode: true                    # Mirrored webcam mode
