# AdaptiveEye - Blink Detection & Intentional Eye Clicking Configuration
blink_detection:
  ear_threshold: 0.22                  # 0.22 captures natural eyelid closure without straining
  min_blink_duration_ms: 160.0         # 160ms (~5 video frames) = reliable intentional single click
  max_click_blink_duration_ms: 650.0   # 160ms - 650ms = intentional Single Click (Left Click)
  double_click_window_ms: 480.0        # Max interval between 2 intentional blinks for Double Click
  long_blink_right_click_ms: 9999.0    # Long blink right click disabled (pure single & double click mode)
  enable_wink_clicking: false          # Unilateral winking disabled as requested
  enable_wink_right_click: false       # Unilateral winking disabled as requested
  wink_min_duration_ms: 280.0          # Minimum wink hold time
  click_debounce_ms: 380.0             # Refractory period after click to prevent repeats
  enable_sound_feedback: true          # Play chime on successful click
  hold_position_during_blink: true     # Freeze cursor coordinate during click blink
  mirror_mode: true                    # Mirrored webcam mode
