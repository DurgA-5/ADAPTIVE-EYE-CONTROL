# AdaptiveEye - Cursor Stabilization & Micro-Saccade Jitter Suppression Configuration
stabilization:
  algorithm: "adaptive_ema"             # "adaptive_ema" (recommended for ultra-low latency), "kalman", or "hybrid"
  deadzone_radius_px: 12.0             # Displacements below 12px are held completely stationary during fixations
  min_alpha: 0.10                      # Fixation smoothing factor (rock-solid cursor, zero tremor)
  max_alpha: 0.85                      # Responsive saccadic tracking (immediate cursor response to eye movement)
  saccade_velocity_threshold_px_s: 320.0  # Velocity threshold to trigger fast tracking
  kalman_process_noise: 0.08           # Kalman model uncertainty Q
  kalman_measurement_noise_base: 1.2   # Base measurement covariance R
  confidence_noise_multiplier: 12.0    # Inflation factor for R when confidence drops
  hold_position_on_loss: true          # Maintain last known stable coordinate during blinks/occlusions
