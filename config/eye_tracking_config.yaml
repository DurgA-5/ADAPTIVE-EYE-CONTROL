# AdaptiveEye - Eye Landmark & Iris Tracking Configuration
eye_tracking:
  refine_landmarks: true             # Must be True to extract 478 landmarks (including irises)
  max_num_faces: 4                   # Multi-face tolerance: matches authorized face among up to 4 faces
  min_detection_confidence: 0.55     # Robust face mesh detection confidence
  min_tracking_confidence: 0.55      # Robust temporal landmark tracking confidence
  ear_blink_threshold: 0.17          # Strict closure threshold (prevents false blinks when looking down)
  smooth_landmarks: true             # Temporal landmark smoothing
