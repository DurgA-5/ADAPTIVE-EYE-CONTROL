# AdaptiveEye - Gaze Estimation Configuration
gaze_estimation:
  estimation_approach: "pure_iris"    # "pure_iris" (100% eye-controlled) or "compound" (iris + head pose solvePnP)
  iris_weight: 0.90                 # Weight for relative iris displacement in eye sockets
  head_pose_weight: 0.10            # Weight for 3D head yaw/pitch compensation
  sensitivity_x: 3.5                # Horizontal gaze dynamic range multiplier
  sensitivity_y: 4.0                # Vertical gaze dynamic range multiplier (full top-to-bottom reach)
  center_bias_x: 0.50               # Calibrated rest center point X
  center_bias_y: 0.50               # Calibrated rest center point Y
  min_tracking_confidence: 0.60     # Discards gaze if mesh confidence drops
