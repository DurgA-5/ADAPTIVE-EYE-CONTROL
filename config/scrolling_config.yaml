# AdaptiveEye - Eye Scrolling & Dwell Control Configuration
scrolling:
  # Head-Tilt Continuous Scrolling (Active: Deliberate head tilt UP = scroll UP, head tilt DOWN = scroll DOWN)
  enable_head_tilt_scrolling: true
  head_tilt_pitch_threshold_deg: 8.5   # 8.5 deg pitch angle (deliberate conscious tilt, comfortable without neck strain)
  head_tilt_activation_delay_ms: 200.0 # 200ms deliberate hold before scrolling engages (responsive yet accident-free)

  # Edge / Border Gaze Scrolling (DISABLED by default to prevent accidental scrolling when viewing tabs or taskbar)
  enable_edge_scrolling: false
  top_zone_ratio: 0.10             # Top margin ratio if enabled
  bottom_zone_ratio: 0.10          # Bottom margin ratio if enabled
  activation_delay_ms: 600.0       # Gaze dwell time before border scrolling commences
  scroll_interval_ms: 60.0         # Rate limiting between scroll ticks (smooth continuous scrolling)
  base_wheel_delta: 100            # Controlled wheel delta per tick
  dynamic_speed_scaling: true      # Scale scroll speed based on tilt magnitude (1x to 2.5x)
  max_speed_multiplier: 2.5        # Maximum speed multiplier

  # Dwell Fixation Clicking (DISABLED as requested)
  enable_dwell_clicking: false
  dwell_time_ms: 1200.0            # Fixation duration required to fire a click
  dwell_radius_px: 35.0            # Maximum allowable cursor drift while fixating
  dwell_debounce_ms: 800.0         # Post-click refractory period to prevent accidental re-clicks
  dwell_click_action: "LEFT"       # Action if enabled
  enable_sound_feedback: true      # Audio chime
