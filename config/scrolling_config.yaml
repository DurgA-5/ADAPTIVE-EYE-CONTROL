# AdaptiveEye - Eye Scrolling & Dwell Control Configuration
scrolling:
  # Head-Tilt Continuous Scrolling (Active: Look up head = scroll UP, Look down head = scroll DOWN)
  enable_head_tilt_scrolling: true
  head_tilt_pitch_threshold_deg: 5.5   # 5.5 deg pitch deviation from neutral to start scrolling (effortless head tilt)
  head_tilt_activation_delay_ms: 120.0 # Responsive gesture activation (120ms)

  # Edge / Border Gaze Scrolling (Looking towards top/bottom margin)
  enable_edge_scrolling: true
  top_zone_ratio: 0.14             # Top 14% of screen height triggers scroll up
  bottom_zone_ratio: 0.14          # Bottom 14% of screen height triggers scroll down
  activation_delay_ms: 220.0       # Gaze dwell time before border scrolling commences
  scroll_interval_ms: 65.0         # Rate limiting between scroll ticks
  base_wheel_delta: 120            # Standard Win32 WHEEL_DELTA (positive = up, negative = down)
  dynamic_speed_scaling: true      # Scale scroll speed based on tilt/proximity (1x to 3x)
  max_speed_multiplier: 3.0        # Maximum multiplier at extreme edge/tilt

  # Dwell Fixation Clicking (DISABLED as requested)
  enable_dwell_clicking: false
  dwell_time_ms: 1200.0            # Fixation duration required to fire a click
  dwell_radius_px: 35.0            # Maximum allowable cursor drift while fixating
  dwell_debounce_ms: 800.0         # Post-click refractory period to prevent accidental re-clicks
  dwell_click_action: "LEFT"       # Action if enabled
  enable_sound_feedback: true      # Audio chime
